services:
  - type: web
    name: timetable-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: timetable-backend
          property: port
      - key: MONGO_URI
        sync: false

